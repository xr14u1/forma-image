<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#141916" />
      <stop offset="60%" stop-color="#080A09" />
      <stop offset="100%" stop-color="#020302" />
    </radialGradient>

    <!-- Emerald Primary Gradient -->
    <linearGradient id="emeraldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="50%" stop-color="#00E599" />
      <stop offset="100%" stop-color="#05DF72" />
    </linearGradient>

    <!-- Emerald Dark Gradient for Depth -->
    <linearGradient id="emeraldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D27F" />
      <stop offset="100%" stop-color="#008F56" />
    </linearGradient>

    <!-- Cyan Accent Glow -->
    <linearGradient id="cyanAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFD1" />
      <stop offset="100%" stop-color="#00E599" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00E599" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with OLED Black finish -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGlow)" stroke="#222B26" stroke-width="8" />

  <!-- Ambient Internal Edge Highlight -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(0, 229, 153, 0.15)" stroke-width="3" />

  <!-- Icon Emblem: Geometric High-Tech "F" & Image Processing Layers -->
  <g filter="url(#glow)">
    <!-- Top Horizontal Bar of F -->
    <path d="M 132 136 C 132 120 145 108 161 108 L 360 108 C 374 108 384 120 380 134 L 366 182 C 363 192 354 198 344 198 L 228 198 C 218 198 210 206 210 216 L 210 218 C 210 228 218 236 228 236 L 314 236 C 328 236 338 248 334 262 L 320 310 C 317 320 308 326 298 326 L 228 326 C 218 326 210 334 210 344 L 210 380 C 210 396 197 408 181 408 L 148 408 C 139 408 132 401 132 392 Z" 
          fill="url(#emeraldPrimary)" />

    <!-- Isometric Accent / Conversion Diamond Lens -->
    <path d="M 324 350 L 388 350 C 397 350 404 357 404 366 L 404 384 C 404 397 393 408 380 408 L 298 408 C 289 408 282 401 282 392 L 282 374 C 282 361 293 350 306 350 Z" 
          fill="url(#cyanAccent)" opacity="0.95" />

    <!-- Sparkling Center Core -->
    <circle cx="372" cy="154" r="16" fill="#FFFFFF" opacity="0.9" />
    <circle cx="320" cy="280" r="12" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>